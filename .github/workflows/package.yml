name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  studio:
    name: Windows 3D studio
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the studio
        run: npm ci

      - name: Build the Windows package
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload the 3D studio
        uses: actions/upload-artifact@v4
        with:
          name: DiskUsageAnalyzer3D-windows
          path: |
            web/release/*.exe
          if-no-files-found: error

  desktop:
    name: Windows desktop app
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the desktop app
        run: cargo build --release --bin disk-usage-analyzer
        env:
          CARGO_BUILD_JOBS: "2"

      - name: Upload the desktop app
        uses: actions/upload-artifact@v4
        with:
          name: DiskUsageAnalyzer-windows
          path: target/release/disk-usage-analyzer.exe
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [studio, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: packages/**/*.exe
          generate_release_notes: true
